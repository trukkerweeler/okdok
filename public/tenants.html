<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage all tenants." />
    <meta name="author" content="OKDOK Accounting" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Abel&family=Tapestry&display=swap"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="images/okdok.png" />
    <title>Tenants - Accounting</title>
  </head>
  <body class="tenants-page">
    <header id="header"></header>

    <div
      class="recordsaddrecordheading d-flex align-items-center justify-content-between my-3"
    >
      <h1 class="h3 mb-0">Tenants</h1>
      <button
        class="addrecordheadingbutton btn btn-primary btn-lg"
        id="addTenantBtn"
        title="Add Tenant"
      >
        +
      </button>
    </div>

    <main class="container my-4">
      <!-- Tenants Table -->
      <div id="tenantsTableContainer" class="table-responsive">
        <table id="tenantsTable" class="table table-striped table-hover">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Property</th>
              <th>Status</th>
              <th>Communication</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Populated by JavaScript -->
          </tbody>
        </table>
      </div>

      <div
        id="noTenantsMessage"
        class="alert alert-info mt-4"
        style="display: none"
      >
        No tenants found. Click the + button to add a tenant.
      </div>
    </main>

    <!-- Add/Edit Tenant Dialog -->
    <dialog id="addTenantDialog" class="dialog p-0">
      <div class="dialog-header p-3 border-bottom">
        <h2 class="h5 mb-0">Add New Tenant</h2>
      </div>
      <form id="addTenantForm" class="form p-3">
        <input type="hidden" id="tenantId" name="tenant_id" />

        <div class="row g-3">
          <div class="col-md-6">
            <label for="tenantName" class="form-label required">Name</label>
            <input
              type="text"
              id="tenantName"
              name="name"
              required
              class="form-control"
            />
          </div>

          <div class="col-md-6">
            <label for="tenantEmail" class="form-label">Email</label>
            <input
              type="email"
              id="tenantEmail"
              name="email"
              class="form-control"
            />
          </div>

          <div class="col-md-6">
            <label for="tenantPhone" class="form-label">Phone</label>
            <input
              type="tel"
              id="tenantPhone"
              name="phone"
              class="form-control"
            />
          </div>

          <div class="col-md-6">
            <label for="tenantProperty" class="form-label">Property</label>
            <select id="tenantProperty" name="property_id" class="form-select">
              <option value="">Select a property...</option>
            </select>
          </div>

          <div class="col-md-12">
            <label for="tenantNotes" class="form-label">Notes</label>
            <textarea
              id="tenantNotes"
              name="notes"
              rows="3"
              placeholder="Additional notes about the tenant"
              class="form-control"
            ></textarea>
          </div>
        </div>

        <div class="mt-4 d-flex gap-2 justify-content-end">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="document.getElementById('addTenantDialog').close()"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">Save Tenant</button>
        </div>
      </form>
    </dialog>

    <dialog id="communicationLogDialog" class="dialog p-0">
      <div class="dialog-header p-3 border-bottom">
        <h2 class="h5 mb-0">Tenant Communication Log</h2>
        <p id="communicationTenantName" class="text-muted mb-0"></p>
      </div>
      <div class="p-3">
        <form id="communicationLogForm" class="form mb-4">
          <input type="hidden" id="communicationTenantId" />
          <div class="row g-3">
            <div class="col-md-4">
              <label for="communicationDate" class="form-label required"
                >Date and time</label
              >
              <input
                id="communicationDate"
                type="datetime-local"
                class="form-control"
                required
              />
            </div>
            <div class="col-md-4">
              <label for="communicationMethod" class="form-label required"
                >Method</label
              >
              <select id="communicationMethod" class="form-select" required>
                <option value="call">Call</option>
                <option value="voicemail">Voicemail</option>
                <option value="text">Text</option>
                <option value="email">Email</option>
                <option value="letter">Letter</option>
                <option value="in_person">In person</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="communicationOutcome" class="form-label required"
                >Outcome</label
              >
              <select id="communicationOutcome" class="form-select" required>
                <option value="no_response">No response</option>
                <option value="message_left">Message left</option>
                <option value="sent">Sent</option>
                <option value="responded">Responded</option>
                <option value="resolved">Resolved</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="col-12">
              <label for="communicationSubject" class="form-label required"
                >Subject</label
              >
              <input
                id="communicationSubject"
                type="text"
                class="form-control"
                maxlength="255"
                placeholder="Rent reminder, repair follow-up, notice..."
                required
              />
            </div>
            <div class="col-md-8">
              <label for="communicationNotes" class="form-label">Notes</label>
              <textarea
                id="communicationNotes"
                rows="2"
                class="form-control"
                placeholder="Brief factual summary"
              ></textarea>
            </div>
            <div class="col-md-4">
              <label for="communicationNextFollowUp" class="form-label"
                >Next follow-up</label
              >
              <input
                id="communicationNextFollowUp"
                type="date"
                class="form-control"
              />
            </div>
          </div>
          <div class="mt-3 d-flex gap-2 justify-content-end">
            <button type="submit" class="btn btn-primary">Save Contact</button>
          </div>
        </form>

        <div class="table-responsive">
          <table
            class="table table-sm table-striped"
            id="communicationLogTable"
          >
            <thead class="table-light">
              <tr>
                <th>Date</th>
                <th>Method</th>
                <th>Subject</th>
                <th>Outcome</th>
                <th>Next Follow-up</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="communicationLogEmpty" class="text-muted mb-0">
          No communication entries yet.
        </p>
        <div class="mt-3 d-flex justify-content-end">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="document.getElementById('communicationLogDialog').close()"
          >
            Close
          </button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/js/tenants.mjs"></script>
  </body>
</html>
