<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Invoice management and generation." />
    <meta name="author" content="OKDOK Accounting" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Abel&family=Tapestry&display=swap"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="images/okdok.png" />
    <title>Invoices - Accounting</title>
    <style>
      /* Invoice row shading by property address - override Bootstrap table-hover */
      #invoicesTable tbody .invoice-shade-1,
      #invoicesTable tbody .invoice-shade-1 td {
        background-color: #e3f2fd !important;
      }
      #invoicesTable tbody .invoice-shade-2,
      #invoicesTable tbody .invoice-shade-2 td {
        background-color: #f4faf4 !important;
      }
      #invoicesTable tbody .invoice-shade-3,
      #invoicesTable tbody .invoice-shade-3 td {
        background-color: #fff3e0 !important;
      }
      #invoicesTable tbody .invoice-shade-4,
      #invoicesTable tbody .invoice-shade-4 td {
        background-color: #fce4ec !important;
      }
      #invoicesTable tbody .invoice-shade-5,
      #invoicesTable tbody .invoice-shade-5 td {
        background-color: #f3e5f5 !important;
      }

      /* Prevent hover from overriding */
      #invoicesTable tbody .invoice-shade-1:hover,
      #invoicesTable tbody .invoice-shade-1:hover td,
      #invoicesTable tbody .invoice-shade-2:hover,
      #invoicesTable tbody .invoice-shade-2:hover td,
      #invoicesTable tbody .invoice-shade-3:hover,
      #invoicesTable tbody .invoice-shade-3:hover td,
      #invoicesTable tbody .invoice-shade-4:hover,
      #invoicesTable tbody .invoice-shade-4:hover td,
      #invoicesTable tbody .invoice-shade-5:hover,
      #invoicesTable tbody .invoice-shade-5:hover td {
        background-color: inherit !important;
      }
      .line-item-row .line-item-amount {
        width: 120px;
        flex-shrink: 0;
        -moz-appearance: textfield;
      }
      .line-item-row .line-item-amount::-webkit-outer-spin-button,
      .line-item-row .line-item-amount::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>
  </head>
  <body class="invoices-page">
    <header id="header"></header>
    <div
      class="recordsaddrecordheading d-flex align-items-center justify-content-between my-3"
    >
      <h1 class="h3 mb-0">Invoices</h1>
      <button
        class="addrecordheadingbutton btn btn-primary btn-lg"
        id="addInvoiceBtn"
        title="Add Invoice"
      >
        +
      </button>
    </div>
    <main class="container my-4">
      <!-- Add Invoice Dialog -->
      <dialog id="addInvoiceDialog" class="dialog p-0">
        <div class="dialog-header p-3 border-bottom">
          <h2 class="h5 mb-0">Add New Invoice</h2>
        </div>
        <form id="addInvoiceForm" class="form p-3">
          <div class="row g-3">
            <div class="col-md-12">
              <label for="invoiceLease" class="form-label required"
                >Lease</label
              >
              <select
                id="invoiceLease"
                name="lease_id"
                required
                class="form-control"
              >
                <option value="">Select a lease...</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="invoiceOwner" class="form-label required"
                >Owner</label
              >
              <select
                id="invoiceOwner"
                name="owner_id"
                required
                class="form-control"
              >
                <option value="">Select an owner...</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="invoiceProperty" class="form-label">Property</label>
              <select
                id="invoiceProperty"
                name="property_id"
                class="form-control"
              >
                <option value="">Select a property (optional)...</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="invoiceNumber" class="form-label required"
                >Invoice #</label
              >
              <input
                type="text"
                id="invoiceNumber"
                name="invoice_number"
                placeholder="Auto-generated"
                class="form-control"
                readonly
              />
            </div>

            <div class="col-md-6">
              <label for="invoiceDate" class="form-label required"
                >Invoice Date</label
              >
              <input
                type="date"
                id="invoiceDate"
                name="invoice_date"
                required
                class="form-control"
              />
            </div>

            <div class="col-md-6">
              <label for="invoiceDueDate" class="form-label">Due Date</label>
              <input
                type="date"
                id="invoiceDueDate"
                name="due_date"
                class="form-control"
              />
            </div>

            <div class="col-md-6">
              <label for="invoiceStatus" class="form-label">Status</label>
              <select id="invoiceStatus" name="status" class="form-control">
                <option value="pending">Pending</option>
                <option value="sent">Sent</option>
                <option value="paid">Paid</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>

            <div class="col-12" id="lineItemsSection">
              <label class="form-label required">Line Items</label>
              <div id="lineItemsContainer"></div>
              <button
                type="button"
                id="addLineItemBtn"
                class="btn btn-sm btn-outline-secondary mt-1"
              >
                + Add Line Item
              </button>
              <div
                class="d-flex justify-content-end align-items-center mt-2 pt-2"
                style="border-top: 2px solid #007bff"
              >
                <span class="text-muted me-2" style="font-size: 13px"
                  >TOTAL</span
                >
                <strong
                  id="lineItemsTotal"
                  style="
                    font-size: 1.1em;
                    color: #007bff;
                    font-family: monospace;
                  "
                  >$0.00</strong
                >
                <input
                  type="hidden"
                  id="invoiceAmount"
                  name="amount"
                  value="0"
                />
              </div>
            </div>

            <div class="col-12">
              <label for="invoiceNotes" class="form-label">Notes</label>
              <textarea
                id="invoiceNotes"
                name="notes"
                placeholder="Additional notes..."
                class="form-control"
                rows="3"
              ></textarea>
            </div>
          </div>

          <div class="dialog-actions d-flex gap-2 justify-content-end mt-3">
            <button id="saveInvoiceBtn" type="submit" class="btn btn-primary">
              <span class="btn-icon">✓</span>
              Save Invoice
            </button>
            <button
              type="button"
              id="closeAddInvoiceBtn"
              class="btn btn-secondary"
            >
              <span class="btn-icon">✕</span>
              Cancel
            </button>
          </div>
        </form>
      </dialog>

      <!-- Invoices List Table -->
      <div class="table-responsive">
        <table class="table table-hover table-sm" id="invoicesTable">
          <thead class="table-light">
            <tr>
              <th>Invoice #</th>
              <th>Tenant</th>
              <th>Property</th>
              <th>Lease</th>
              <th>Amount</th>
              <th>Invoice Date</th>
              <th>Due Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="invoicesTableBody">
            <tr>
              <td colspan="9" class="text-center text-muted py-4">
                Loading invoices...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Print Modal -->
    <dialog id="printInvoiceDialog" class="dialog p-0" style="max-width: 800px">
      <div
        class="dialog-header p-3 border-bottom d-flex justify-content-between align-items-center"
      >
        <h2 class="h5 mb-0">Print Invoice</h2>
        <button
          type="button"
          id="closePrintDialog"
          class="btn btn-sm btn-secondary"
        >
          ✕
        </button>
      </div>
      <div id="printContent" class="p-4"></div>
      <div
        class="dialog-actions d-flex gap-2 justify-content-end p-3 border-top"
      >
        <button id="printBtn" type="button" class="btn btn-primary">
          🖨️ Print
        </button>
        <button type="button" id="closeAfterPrintBtn" class="btn btn-secondary">
          Close
        </button>
      </div>
    </dialog>

    <footer id="footer"></footer>
  </body>
  <script type="module" src="/js/invoices.mjs"></script>
</html>
