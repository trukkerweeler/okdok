<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Manage default invoice notes per property."
    />
    <meta name="author" content="OKDOK Accounting" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Abel&family=Tapestry&display=swap"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="images/okdok.png" />
    <title>Invoice Notes - Accounting</title>
  </head>
  <body class="invoice-notes-page">
    <header id="header"></header>

    <div
      class="recordsaddrecordheading d-flex align-items-center justify-content-between my-3"
    >
      <h1 class="h3 mb-0">Invoice Notes</h1>
      <button
        class="addrecordheadingbutton btn btn-primary btn-lg"
        id="addNoteBtn"
        title="Add Note"
      >
        +
      </button>
    </div>

    <main class="container my-4">
      <p class="text-muted mb-3">
        Set a default note per property that will auto-populate when creating an
        invoice. You can clear or edit the note on any individual invoice before
        saving.
      </p>

      <!-- Add/Edit Note Dialog -->
      <dialog id="noteDialog" class="dialog p-0">
        <div class="dialog-header p-3 border-bottom">
          <h2 class="h5 mb-0" id="noteDialogTitle">Add Note</h2>
        </div>
        <form id="noteForm" class="form p-3">
          <input type="hidden" id="noteId" />
          <div class="row g-3">
            <div class="col-12">
              <label for="noteProperty" class="form-label required"
                >Property</label
              >
              <select
                id="noteProperty"
                name="property_id"
                required
                class="form-control"
              >
                <option value="">Select a property...</option>
              </select>
            </div>
            <div class="col-12">
              <label for="noteText" class="form-label required"
                >Note Text</label
              >
              <textarea
                id="noteText"
                name="note_text"
                class="form-control"
                rows="4"
                required
                placeholder="e.g., Please pay through Zelle to 801-555-1234"
              ></textarea>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="noteActive"
                  name="is_active"
                  checked
                />
                <label class="form-check-label" for="noteActive">
                  Active (will auto-populate on invoices)
                </label>
              </div>
            </div>
          </div>
          <div class="dialog-actions d-flex gap-2 justify-content-end mt-3">
            <button id="saveNoteBtn" type="submit" class="btn btn-primary">
              <span class="btn-icon">✓</span> Save Note
            </button>
            <button type="button" id="cancelNoteBtn" class="btn btn-secondary">
              <span class="btn-icon">✕</span> Cancel
            </button>
          </div>
        </form>
      </dialog>

      <!-- Notes Table -->
      <div class="table-responsive">
        <table class="table table-hover table-sm" id="notesTable">
          <thead class="table-light">
            <tr>
              <th>Property</th>
              <th>Note</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="notesTableBody">
            <tr>
              <td colspan="4" class="text-center text-muted py-4">
                Loading notes...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer id="footer"></footer>
  </body>
  <script type="module" src="/js/invoice-notes.mjs"></script>
</html>
