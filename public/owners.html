<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Property owner management." />
    <meta name="author" content="OKDOK Accounting" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Abel&family=Tapestry&display=swap"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="images/okdok.png" />
    <title>Owners - Accounting</title>
  </head>
  <body class="owners-page">
    <header id="header"></header>
    <div
      class="recordsaddrecordheading d-flex align-items-center justify-content-between my-3"
    >
      <h1 class="h3 mb-0">Property Owners</h1>
      <button
        class="addrecordheadingbutton btn btn-primary btn-lg"
        id="addOwnerBtn"
        title="Add Owner"
      >
        +
      </button>
    </div>
    <main class="container my-4">
      <!-- Add Owner Dialog -->
      <dialog id="addOwnerDialog" class="dialog p-0">
        <div class="dialog-header p-3 border-bottom">
          <h2 class="h5 mb-0">Add New Owner</h2>
        </div>
        <form id="addOwnerForm" class="form p-3">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="ownerName" class="form-label required">Name</label>
              <input
                type="text"
                id="ownerName"
                name="name"
                required
                placeholder="Enter owner name"
                class="form-control"
              />
            </div>

            <div class="col-md-6">
              <label for="ownerEmail" class="form-label required">Email</label>
              <input
                type="email"
                id="ownerEmail"
                name="email"
                required
                placeholder="Enter email address"
                class="form-control"
              />
            </div>

            <div class="col-md-6">
              <label for="ownerPhone" class="form-label">Phone</label>
              <input
                type="tel"
                id="ownerPhone"
                name="phone"
                placeholder="Enter phone number"
                class="form-control"
              />
            </div>

            <div class="col-md-6">
              <label for="ownerBankAccount" class="form-label required"
                >Bank Account</label
              >
              <input
                type="text"
                id="ownerBankAccount"
                name="payout_bank_account"
                required
                placeholder="Payout bank account"
                class="form-control"
              />
            </div>
          </div>

          <div class="dialog-actions d-flex gap-2 justify-content-end mt-3">
            <button id="saveOwnerBtn" type="submit" class="btn btn-primary">
              <span class="btn-icon">✓</span>
              Save Owner
            </button>
            <button
              type="button"
              id="closeAddOwnerBtn"
              class="btn btn-secondary"
            >
              <span class="btn-icon">✕</span>
              Cancel
            </button>
          </div>
        </form>
      </dialog>

      <!-- Owners List Table -->
      <div class="table-responsive">
        <table class="table table-hover table-sm" id="ownersTable">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Bank Account</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="ownersTableBody">
            <tr>
              <td colspan="6" class="text-center text-muted py-4">
                Loading owners...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <footer id="footer"></footer>
  </body>
  <script type="module" src="/js/owners.mjs"></script>
</html>
