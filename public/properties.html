<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Property management." />
    <meta name="author" content="OKDOK Accounting" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Abel&family=Tapestry&display=swap"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="images/okdok.png" />
    <title>Properties - Accounting</title>
  </head>
  <body class="properties-page">
    <header id="header"></header>
    <div
      class="recordsaddrecordheading d-flex align-items-center justify-content-between my-3"
    >
      <h1 class="h3 mb-0">Rental Properties</h1>
      <button
        class="addrecordheadingbutton btn btn-primary btn-lg"
        id="addPropertyBtn"
        title="Add Property"
      >
        +
      </button>
    </div>
    <main class="container my-4">
      <!-- Add Property Dialog -->
      <dialog id="addPropertyDialog" class="dialog p-0">
        <div class="dialog-header p-3 border-bottom">
          <h2 class="h5 mb-0">Add New Property</h2>
        </div>
        <form id="addPropertyForm" class="form p-3">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="propertyOwner" class="form-label required"
                >Owner</label
              >
              <select
                id="propertyOwner"
                name="owner_id"
                required
                class="form-select"
              >
                <option value="">Select an owner...</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="propertyStatus" class="form-label">Status</label>
              <select id="propertyStatus" name="status" class="form-select">
                <option value="active" selected>Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>

            <div class="col-md-12">
              <label for="propertyAddress" class="form-label required"
                >Address</label
              >
              <input
                type="text"
                id="propertyAddress"
                name="address"
                required
                placeholder="Street address"
                class="form-control"
              />
            </div>

            <div class="col-md-6">
              <label for="propertyCity" class="form-label required">City</label>
              <input
                type="text"
                id="propertyCity"
                name="city"
                required
                placeholder="City"
                class="form-control"
              />
            </div>

            <div class="col-md-3">
              <label for="propertyState" class="form-label required"
                >State</label
              >
              <input
                type="text"
                id="propertyState"
                name="state"
                required
                placeholder="State"
                class="form-control"
                maxlength="2"
              />
            </div>

            <div class="col-md-3">
              <label for="propertyZip" class="form-label required">Zip</label>
              <input
                type="text"
                id="propertyZip"
                name="zip"
                required
                placeholder="Zip"
                class="form-control"
              />
            </div>
          </div>

          <div class="dialog-actions d-flex gap-2 justify-content-end mt-3">
            <button id="savePropertyBtn" type="submit" class="btn btn-primary">
              <span class="btn-icon">✓</span>
              Save Property
            </button>
            <button
              type="button"
              id="closeAddPropertyBtn"
              class="btn btn-secondary"
            >
              <span class="btn-icon">✕</span>
              Cancel
            </button>
          </div>
        </form>
      </dialog>

      <!-- Properties List Table -->
      <div class="table-responsive">
        <table class="table table-hover table-sm" id="propertiesTable">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Owner</th>
              <th>Address</th>
              <th>City</th>
              <th>State</th>
              <th>Zip</th>
              <th>Status</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="propertiesTableBody">
            <tr>
              <td colspan="8" class="text-center text-muted py-4">
                Loading properties...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <footer id="footer"></footer>
  </body>
  <script type="module" src="/js/properties.mjs"></script>
</html>
