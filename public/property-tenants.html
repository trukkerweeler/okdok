<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage tenants for properties." />
    <meta name="author" content="OKDOK Accounting" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Abel&family=Tapestry&display=swap"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="images/okdok.png" />
    <title>Property Tenants - Accounting</title>
  </head>
  <body class="property-tenants-page">
    <header id="app-header"></header>

    <!-- Property Info Section -->
    <main class="container my-4">
      <div class="property-info-section mb-4 p-4 bg-light border rounded">
        <h1 class="h3 mb-3">Property Tenants</h1>

        <div id="propertyDetails" class="row g-3">
          <!-- Property details loaded here -->
        </div>
      </div>

      <!-- Tenants Management Section -->
      <div
        class="recordsaddrecordheading d-flex align-items-center justify-content-between my-3"
      >
        <h2 class="h3 mb-0">Tenants</h2>
        <button
          class="addrecordheadingbutton btn btn-primary btn-lg"
          id="addTenantBtn"
          title="Add Tenant"
        >
          +
        </button>
      </div>

      <!-- Tenants Table -->
      <div id="tenantsTableContainer" class="table-responsive">
        <table id="tenantsTable" class="table table-striped table-hover">
          <thead class="table-light">
            <tr>
              <th>Primary</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Lease Start</th>
              <th>Lease End</th>
              <th>Rent Amount</th>
              <th>Deposit</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Populated by JavaScript -->
          </tbody>
        </table>
      </div>

      <div
        id="noTenantsMessage"
        class="alert alert-info mt-4"
        style="display: none"
      >
        No tenants found for this property. Click the + button to add a tenant.
      </div>
    </main>

    <!-- Add/Edit Tenant Dialog -->
    <dialog id="addTenantDialog" class="dialog p-0">
      <div class="dialog-header p-3 border-bottom">
        <h2 class="h5 mb-0">Add New Tenant</h2>
      </div>
      <form id="addTenantForm" class="form p-3">
        <input type="hidden" id="propertyId" name="property_id" />
        <input type="hidden" id="tenantId" name="tenant_id" />

        <div class="row g-3">
          <div class="col-md-6">
            <label for="tenantName" class="form-label required">Name</label>
            <input
              type="text"
              id="tenantName"
              name="name"
              required
              placeholder="Tenant name"
              class="form-control"
            />
          </div>

          <div class="col-md-6">
            <label for="tenantEmail" class="form-label">Email</label>
            <input
              type="email"
              id="tenantEmail"
              name="email"
              placeholder="Email address"
              class="form-control"
            />
          </div>

          <div class="col-md-6">
            <label for="tenantPhone" class="form-label">Phone</label>
            <input
              type="tel"
              id="tenantPhone"
              name="phone"
              placeholder="Phone number"
              class="form-control"
            />
          </div>

          <div class="col-md-6">
            <label for="leaseStart" class="form-label required"
              >Lease Start</label
            >
            <input
              type="date"
              id="leaseStart"
              name="lease_start"
              required
              class="form-control"
            />
          </div>

          <div class="col-md-6">
            <label for="leaseEnd" class="form-label">Lease End</label>
            <input
              type="date"
              id="leaseEnd"
              name="lease_end"
              class="form-control"
            />
          </div>

          <div class="col-md-6">
            <label for="rentAmount" class="form-label required"
              >Monthly Rent</label
            >
            <input
              type="number"
              id="rentAmount"
              name="rent_amount"
              required
              step="0.01"
              placeholder="0.00"
              class="form-control"
            />
          </div>

          <div class="col-md-6">
            <label for="depositAmount" class="form-label">Deposit</label>
            <input
              type="number"
              id="depositAmount"
              name="deposit_amount"
              step="0.01"
              placeholder="0.00"
              class="form-control"
            />
          </div>
        </div>

        <div class="mt-4 d-flex gap-2 justify-content-end">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="document.getElementById('addTenantDialog').close()"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">Save Tenant</button>
        </div>
      </form>
    </dialog>

    <!-- Confirm Primary Tenant Dialog -->
    <dialog id="setPrimaryTenantDialog" class="dialog p-0">
      <div class="dialog-header p-3 border-bottom">
        <h2 class="h5 mb-0">Set Primary Tenant</h2>
      </div>
      <div class="p-3">
        <p id="setPrimaryTenantMessage" class="mb-4">
          Are you sure you want to set <strong id="selectedTenantName"></strong>
          as the primary tenant for this property?
        </p>
        <div class="d-flex gap-2 justify-content-end">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="document.getElementById('setPrimaryTenantDialog').close()"
          >
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-primary"
            onclick="confirmSetPrimaryTenant()"
          >
            Set as Primary
          </button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/js/property-tenants.mjs"></script>
  </body>
</html>
