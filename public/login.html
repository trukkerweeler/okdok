<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to OKDOK." />
    <title>Login - OKDOK</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6f8;
      }
      main {
        width: min(100% - 2rem, 26rem);
      }
    </style>
  </head>
  <body>
    <main class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Sign in to OKDOK</h1>
        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              id="username"
              name="username"
              class="form-control"
              autocomplete="username"
              required
              autofocus
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              class="form-control"
              autocomplete="current-password"
              required
            />
          </div>
          <p id="loginError" class="text-danger" role="alert" hidden></p>
          <button id="submitButton" class="btn btn-primary w-100" type="submit">
            Log in
          </button>
        </form>
      </div>
    </main>
    <script type="module" src="/js/login.mjs"></script>
  </body>
</html>
